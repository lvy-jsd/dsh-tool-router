[package]
name = "tool-router-sidecar"
version = "0.1.0"
edition = "2021"
description = "BM25 retrieval sidecar for the dsh-tool-router plugin (tantivy over a Unix socket)"

[dependencies]
tantivy = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1